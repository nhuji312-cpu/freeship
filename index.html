  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vintage Mood Shop</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Pretendard', sans-serif;
    }

    body{
      background:#f6efe7;
      color:#3a2d28;
    }

    .top-banner{
      background:#d48b72;
      color:white;
      text-align:center;
      padding:14px;
      font-size:18px;
      font-weight:700;
      letter-spacing:-0.5px;
    }

    .hero{
      padding:50px 20px 30px;
      text-align:center;
    }

    .hero h1{
      font-size:42px;
      margin-bottom:12px;
    }

    .hero p{
      color:#7b6b63;
      font-size:16px;
    }

    .product-wrap{
      width:90%;
      max-width:1100px;
      margin:auto;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:24px;
      padding-bottom:60px;
    }

    .card{
      background:white;
      border-radius:24px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.08);
      transition:0.3s;
      position:relative;
    }

    .card:hover{
      transform:translateY(-6px);
    }

    .card img{
      width:100%;
      height:300px;
      object-fit:cover;
    }

    .free-badge{
      position:absolute;
      top:14px;
      left:14px;
      background:#ff7f5f;
      color:white;
      padding:8px 14px;
      border-radius:999px;
      font-size:13px;
      font-weight:700;
    }

    .content{
      padding:20px;
    }

    .title{
      font-size:22px;
      margin-bottom:10px;
      font-weight:700;
    }

    .desc{
      color:#7d726d;
      font-size:14px;
      line-height:1.6;
      margin-bottom:16px;
    }

    .price{
      font-size:24px;
      font-weight:800;
      margin-bottom:18px;
    }

    .btn{
      width:100%;
      border:none;
      background:#3d2e2a;
      color:white;
      padding:14px;
      border-radius:14px;
      font-size:15px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#5b433d;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#8b817c;
      font-size:14px;
    }
  </style>
</head>

<body>

  <!-- TEST A -->
  <div class="top-banner">
    VINTAGE SHOP
  </div>

  <section class="hero">
    <h1>Vintage Mood</h1>
    <p>
      감성 빈티지 셀렉트샵 · 레트로 무드 아이템
    </p>
  </section>

  <section class="product-wrap">

    <div class="card">
      <div class="free-badge">무료배송</div>

      <img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1200&auto=format&fit=crop" />

      <div class="content">
        <div class="title">Vintage Jacket</div>

        <div class="desc">
          90s 무드의 오버핏 빈티지 자켓
        </div>

        <div class="price">₩49,000</div>

        <button class="btn">구매하기</button>
      </div>
    </div>

    <div class="card">
      <div class="free-badge">무료배송</div>

      <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1200&auto=format&fit=crop" />

      <div class="content">
        <div class="title">Retro Denim</div>

        <div class="desc">
          워싱 포인트가 매력적인 데님 팬츠
        </div>

        <div class="price">₩39,000</div>

        <button class="btn">구매하기</button>
      </div>
    </div>

    <div class="card">
      <div class="free-badge">무료배송</div>

      <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1200&auto=format&fit=crop" />

      <div class="content">
        <div class="title">Classic Bag</div>

        <div class="desc">
          빈티지 감성의 레더 숄더백
        </div>

        <div class="price">₩57,000</div>

        <button class="btn">구매하기</button>
      </div>
    </div>

  </section>

  <footer>
    © 2026 Vintage Mood Store
  </footer>

</body>
</html>
